android.useAndroidX=true
android.enableJetifier=true

# --- JDK y Gradle (error "What went wrong: 25.0.1") ---
# Ese mensaje aparece cuando la JVM que ejecuta Gradle es JDK 25: el Kotlin
# embebido en el DSL aún no interpreta bien esa versión.
# Opciones:
#   A) export JAVA_HOME=$(/usr/libexec/java_home -v 17)   # macOS, antes de ./gradlew
#   B) ./gradlew17 :app:assembleRelease                    # script en la raíz del repo
#   C) Descomenta y pon la ruta real a tu JDK 17/21 (no subas rutas personales al repo):
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home

# Kotlin daemon - aumentar heap para compilar material-icons-extended y Glance
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Gradle JVM heap
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Compilación paralela
org.gradle.parallel=true
org.gradle.caching=true
